@switch (variant) {
  @case ('primary') {
    <button mat-raised-button [color]="color" [type]="type" [disabled]="disabled || loading"
            [attr.aria-label]="ariaLabel" (click)="onClick($event)">
      <ng-container *ngTemplateOutlet="content"></ng-container>
    </button>
  }
  @case ('secondary') {
    <button mat-flat-button [color]="color" [type]="type" [disabled]="disabled || loading"
            [attr.aria-label]="ariaLabel" (click)="onClick($event)">
      <ng-container *ngTemplateOutlet="content"></ng-container>
    </button>
  }
  @case ('stroked') {
    <button mat-stroked-button [color]="color" [type]="type" [disabled]="disabled || loading"
            [attr.aria-label]="ariaLabel" (click)="onClick($event)">
      <ng-container *ngTemplateOutlet="content"></ng-container>
    </button>
  }
  @case ('text') {
    <button mat-button [color]="color" [type]="type" [disabled]="disabled || loading"
            [attr.aria-label]="ariaLabel" (click)="onClick($event)">
      <ng-container *ngTemplateOutlet="content"></ng-container>
    </button>
  }
  @case ('icon') {
    <button mat-icon-button [color]="color" [type]="type" [disabled]="disabled || loading"
            [attr.aria-label]="ariaLabel" (click)="onClick($event)">
      @if (loading) {
        <mat-spinner diameter="18"></mat-spinner>
      } @else if (icon) {
        <mat-icon>{{ icon }}</mat-icon>
      }
    </button>
  }
}

<ng-template #content>
  @if (loading) {
    <mat-spinner diameter="18" class="app-button__spinner app-button__spinner--left"></mat-spinner>
  } @else if (icon && iconPosition === 'left') {
    <mat-icon class="app-button__icon app-button__icon--left">{{ icon }}</mat-icon>
  }
  <ng-content></ng-content>
  @if (!loading && icon && iconPosition === 'right') {
    <mat-icon class="app-button__icon app-button__icon--right">{{ icon }}</mat-icon>
  }
</ng-template>
